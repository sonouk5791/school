<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>20분 체조 음성·대본 검토</title><style>body{max-width:960px;margin:30px auto;padding:0 20px;font:22px/1.6 system-ui;color:#3b352c;background:#faf6ed}h1{font-size:32px}.notice{border:2px solid #b78029;background:#fff3d8;border-radius:18px;padding:18px}article{background:#fff;border:1px solid #dcd4c7;border-radius:22px;padding:28px;margin:24px 0;text-align:center}button,select{font:inherit;min-height:60px;border:2px solid #9f9b83;border-radius:14px;padding:10px 18px;background:#fff;cursor:pointer;margin:5px}button:focus-visible,select:focus-visible{outline:4px solid #586f46}button.primary{background:#547649;color:white}#cue{font-size:30px;min-height:100px;font-weight:700}audio{width:100%}progress{width:100%;height:20px}nav{display:flex;flex-wrap:wrap;justify-content:center}small{font-size:17px}a{color:#385932}@media(max-width:500px){h1{font-size:27px}body{font-size:20px}article{padding:16px}button{flex:1}#cue{font-size:25px}}</style></head><body>
<h1>콩이와 친구들의 20분 의자 체조</h1><p class="notice"><strong>제작 중 · 음성 및 대본 검토용</strong><br>캐릭터 운동 시범 영상은 아직 완성되지 않았습니다. 이 페이지는 어르신용 완성 수업이 아닙니다.</p>
<article><h2 id="chapter">인사와 준비운동</h2><p id="cue" role="status">시작을 누르면 안내 음성을 들을 수 있습니다.</p><p id="time">00:00 / 20:00</p><progress id="progress" max="1200" value="0" aria-label="음성 재생 진행"></progress><audio id="audio" src="audio/class-20min.mp3" controls preload="metadata"></audio><nav><button class="primary" id="start">▶ 음성 시작</button><button id="pause">⏸ 잠시 쉬기</button><button id="again">🔊 다시 듣기</button><button id="mute" aria-pressed="false">🔇 소리 끄기</button><button id="reset">처음부터</button></nav><label for="chapters">검토할 구간</label><select id="chapters"></select><button id="jump">선택 구간으로</button></article><p><a href="program.json">진행 데이터</a> · <a href="captions-ko.vtt">한국어 자막</a> · <a href="audio/class-20min.mp3" download>음성 받기</a> · <a href="/">학교로 돌아가기</a></p><small>8개 챕터 · 236개 진행 큐 · 59개 안내 문장 · 75 BPM 반주<br>운동 시범 제작과 정확성 검수가 끝난 뒤 기존 학교 체조 화면에 연결할 예정입니다.</small>
<script>
(async()=>{'use strict';const p=await fetch('program.json').then(r=>r.json()),a=document.querySelector('#audio'),sel=document.querySelector('#chapters');let last=-1;const fmt=t=>`${Math.floor(t/60).toString().padStart(2,'0')}:${Math.floor(t%60).toString().padStart(2,'0')}`;
p.chapters.forEach(c=>{const o=document.createElement('option');o.value=c.start;o.textContent=fmt(c.start)+' · '+c.title;sel.append(o)});
const play=()=>a.play().catch(()=>document.querySelector('#cue').textContent='음성을 불러오지 못했어요. 다시 눌러주세요.');
document.querySelector('#start').onclick=play;document.querySelector('#pause').onclick=()=>a.pause();document.querySelector('#reset').onclick=()=>{a.currentTime=0;play()};document.querySelector('#again').onclick=()=>{a.currentTime=p.events[Math.max(last,0)].start;play()};document.querySelector('#mute').onclick=e=>{a.muted=!a.muted;e.currentTarget.textContent=a.muted?'🔊 소리 켜기':'🔇 소리 끄기';e.currentTarget.setAttribute('aria-pressed',String(a.muted))};document.querySelector('#jump').onclick=()=>{a.currentTime=Number(sel.value);play()};
a.addEventListener('timeupdate',()=>{const t=Math.min(a.currentTime,1200);document.querySelector('#time').textContent=fmt(t)+' / 20:00';document.querySelector('#progress').value=t;const i=p.events.findIndex(e=>t>=e.start&&t<e.end);if(i>=0&&i!==last){last=i;document.querySelector('#cue').textContent=p.events[i].text;document.querySelector('#chapter').textContent=p.chapters[p.events[i].chapter].title}});a.addEventListener('ended',()=>document.querySelector('#cue').textContent='음성 검토가 끝났습니다.');document.addEventListener('visibilitychange',()=>{if(document.hidden)a.pause()});window.addEventListener('pagehide',()=>a.pause());window.chairReview={program:p,audio:a};})();
</script></body></html>
