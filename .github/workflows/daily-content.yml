name: Daily AI Cognitive Activity Content Generator

on:
  schedule:
    # Run every day at 04:00 KST (19:00 UTC previous day)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  generate-daily-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run AI Generator & Evaluator Pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/dailyAiGenerator.ts

      - name: Commit & Push Candidate Payload (if changed)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/
          git status
          git diff-index --quiet HEAD || git commit -m "chore(ai): Generate daily cognitive activity candidate [skip ci]"
          git push
