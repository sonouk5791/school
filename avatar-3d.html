<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 3D 콩이 아바타 플랫폼 | 디지털 AI학교</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: radial-gradient(circle at center, #1e2238 0%, #0d111e 60%, #06080e 100%);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            color: #ffffff;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Top Navigation / Status Header */
        .top-nav {
            position: absolute;
            top: 20px;
            left: 24px;
            right: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }
        .brand-badge {
            pointer-events: auto;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 9999px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-decoration: none;
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .brand-badge:hover {
            background: rgba(30, 41, 59, 0.9);
            border-color: #38bdf8;
            transform: translateY(-2px);
        }
        .status-pill {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 10px #22c55e;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        /* 3D Audio Visualizer Bar HUD */
        .audio-meter-wrap {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            z-index: 15;
            transition: opacity 0.3s;
        }
        .meter-bar {
            width: 4px;
            height: 24px;
            background: #38bdf8;
            border-radius: 2px;
            transform: scaleY(0.15);
            transition: transform 0.08s ease;
        }

        /* Interactive Bottom Control Dock */
        .control-dock {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 18px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            z-index: 20;
            max-width: 90vw;
        }
        .tts-input {
            width: 320px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            color: #ffffff;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s;
        }
        .tts-input:focus {
            background: rgba(255, 255, 255, 0.14);
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #0f172a;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 172, 254, 0.6);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        .btn-secondary.active {
            background: #ef4444;
            border-color: #f87171;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
        }

        /* 3D View Hint & Helper */
        .interaction-hint {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 16px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            font-size: 12px;
            color: #94a3b8;
            pointer-events: none;
            z-index: 10;
        }

        /* Welcome & Start Overlay */
        #welcome-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.92) 0%, rgba(6, 8, 14, 0.98) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 100;
            text-align: center;
            padding: 24px;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .overlay-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 32px;
            padding: 48px 40px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: card-appear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes card-appear {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .overlay-icon {
            font-size: 48px;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 20px #38bdf8);
        }
        .overlay-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #93c5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .overlay-desc {
            font-size: 15px;
            line-height: 1.6;
            color: #94a3b8;
            margin-bottom: 32px;
        }
        .start-btn {
            padding: 16px 40px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 20px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #04101e;
            font-weight: 800;
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.5);
            transition: all 0.25s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .start-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px rgba(79, 172, 254, 0.7);
        }

        /* Loading Spinner inside Canvas */
        #model-loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 5;
            color: #38bdf8;
            font-weight: 700;
            font-size: 14px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .control-dock {
                flex-direction: column;
                width: 90%;
                bottom: 16px;
            }
            .tts-input {
                width: 100%;
            }
            .overlay-card {
                padding: 32px 24px;
            }
        }
    </style>
    <!-- Three.js, GLTFLoader, OrbitControls 로드 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Top Navigation -->
    <div class="top-nav">
        <a href="index.html" class="brand-badge">
            <span>⬅</span>
            <span>디지털 AI학교 홈으로</span>
        </a>
        <div class="status-pill">
            <div class="status-dot"></div>
            <span id="system-status">3D 아바타 엔진 준비 완료</span>
        </div>
    </div>

    <!-- 3D Interaction Hint -->
    <div class="interaction-hint">
        마우스 드래그로 360° 회전 • 스크롤로 확대/축소 • 우클릭으로 이동
    </div>

    <!-- Audio Visualizer Meter -->
    <div class="audio-meter-wrap" id="audio-meter">
        <div class="meter-bar" id="bar1"></div>
        <div class="meter-bar" id="bar2"></div>
        <div class="meter-bar" id="bar3"></div>
        <div class="meter-bar" id="bar4"></div>
        <div class="meter-bar" id="bar5"></div>
        <div class="meter-bar" id="bar6"></div>
        <div class="meter-bar" id="bar7"></div>
    </div>

    <!-- Bottom Control Dock -->
    <div class="control-dock">
        <input type="text" id="tts-text-input" class="tts-input" value="안녕하세요, 여러분! 디지털 AI학교에 오신 것을 환영합니다." placeholder="콩이에게 시킬 말을 입력하세요...">
        <button id="speak-btn" class="btn-action btn-primary">
            <span>🗣️ 말하기</span>
        </button>
        <button id="reset-cam-btn" class="btn-action btn-secondary" title="카메라 정면 리셋">
            <span>🎯 정면 보기</span>
        </button>
        <button id="mic-btn" class="btn-action btn-secondary" title="실시간 마이크 연동">
            <span>🎙️ 마이크 립싱크</span>
        </button>
    </div>

    <!-- Loading Indicator -->
    <div id="model-loader">
        <div class="spinner"></div>
        <span>3D 콩이 아바타 로딩 중...</span>
    </div>

    <!-- Welcome Overlay -->
    <div id="welcome-overlay">
        <div class="overlay-card">
            <div class="overlay-icon">🐾</div>
            <h1 class="overlay-title">실시간 3D 콩이 아바타</h1>
            <p class="overlay-desc">
                디지털 AI학교의 AI 마스코트 '콩이'가 3D 공간에서 실시간 음성에 맞추어 대화합니다.
                아래 버튼을 눌러 3D 인터랙티브 공간에 입장해보세요!
            </p>
            <button id="start-btn" class="start-btn">
                <span>🚀 입장하기 & 음성 듣기</span>
            </button>
        </div>
    </div>

    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls, model;
        let mouthTargetIndex = null; // 입 모양 모프 타겟 인덱스 (지원 시)
        let audioContext, analyser, dataArray;
        let isSpeaking = false;
        let isMicActive = false;
        let micStream = null;
        let micSource = null;
        let baseModelY = 0;
        let initialCamPos = { x: 0, y: 1.0, z: 3.4 };

        const container = document.getElementById('canvas-container');
        const overlay = document.getElementById('welcome-overlay');
        const startBtn = document.getElementById('start-btn');
        const speakBtn = document.getElementById('speak-btn');
        const resetCamBtn = document.getElementById('reset-cam-btn');
        const micBtn = document.getElementById('mic-btn');
        const ttsInput = document.getElementById('tts-text-input');
        const loaderElem = document.getElementById('model-loader');
        const systemStatus = document.getElementById('system-status');
        const meterBars = [
            document.getElementById('bar1'),
            document.getElementById('bar2'),
            document.getElementById('bar3'),
            document.getElementById('bar4'),
            document.getElementById('bar5'),
            document.getElementById('bar6'),
            document.getElementById('bar7')
        ];

        // 1. Three.js 기본 씬 & 렌더러 & 조명 세팅
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0d111e, 0.08);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(initialCamPos.x, initialCamPos.y, initialCamPos.z);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.1;
            container.appendChild(renderer.domElement);

            // OrbitControls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 6.0;
            controls.minDistance = 1.0;
            controls.maxPolarAngle = Math.PI / 2 + 0.1;
            controls.target.set(0, 0.8, 0);

            // 조명 (스튜디오 3점 조명 + 림 라이트)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambientLight);

            const keyLight = new THREE.DirectionalLight(0xe0f2fe, 1.2);
            keyLight.position.set(2.5, 4, 3);
            keyLight.castShadow = true;
            scene.add(keyLight);

            const fillLight = new THREE.DirectionalLight(0xa5b4fc, 0.6);
            fillLight.position.set(-3, 2, -1);
            scene.add(fillLight);

            const rimLight = new THREE.PointLight(0x38bdf8, 2.0, 10);
            rimLight.position.set(0, 2.5, -2);
            scene.add(rimLight);

            // 3D 무대 바닥 원형 플랫폼 (Cyber Grid Glow)
            const stageGeometry = new THREE.CylinderGeometry(1.6, 1.7, 0.08, 48);
            const stageMaterial = new THREE.MeshStandardMaterial({
                color: 0x111827,
                roughness: 0.3,
                metalness: 0.8
            });
            const stage = new THREE.Mesh(stageGeometry, stageMaterial);
            stage.position.y = -0.04;
            stage.receiveShadow = true;
            scene.add(stage);

            const ringGeometry = new THREE.RingGeometry(1.5, 1.58, 48);
            const ringMaterial = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide });
            const glowRing = new THREE.Mesh(ringGeometry, ringMaterial);
            glowRing.rotation.x = -Math.PI / 2;
            glowRing.position.y = 0.005;
            scene.add(glowRing);

            // GLB 3D 모델 로드
            loadModel();

            window.addEventListener('resize', onWindowResize);
        }

        // 2. GLB 모델 로드 & 자동 센터링 및 스케일 조정
        function loadModel() {
            const loader = new THREE.GLTFLoader();
            const modelUrl = 'assets/models/kongi_3d.glb';

            loader.load(
                modelUrl,
                function (gltf) {
                    model = gltf.scene;

                    // 바운딩 박스를 계산하여 캐릭터 중앙 정렬 및 최적 크기 자동 조절
                    const box = new THREE.Box3().setFromObject(model);
                    const size = box.getSize(new THREE.Vector3());
                    const center = box.getCenter(new THREE.Vector3());

                    // 높이 약 1.4 유닛으로 자동 스케일링
                    const maxDim = Math.max(size.x, size.y, size.z);
                    const targetScale = 1.4 / (maxDim || 1.0);
                    model.scale.set(targetScale, targetScale, targetScale);

                    // 바닥(Y=0) 위에 위치하도록 배치
                    model.position.x = -center.x * targetScale;
                    model.position.y = -box.min.y * targetScale;
                    model.position.z = -center.z * targetScale;
                    baseModelY = model.position.y;

                    // 그림자 및 재질 최적화
                    model.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.material) {
                                child.material.roughness = Math.max(0.35, child.material.roughness || 0.4);
                            }
                            // 모프 타겟(BlendShape) 확인
                            if (child.morphTargetDictionary) {
                                const dict = child.morphTargetDictionary;
                                console.log("발견된 모프 타겟:", dict);
                                if (dict['mouthOpen'] !== undefined) mouthTargetIndex = dict['mouthOpen'];
                                else if (dict['jawOpen'] !== undefined) mouthTargetIndex = dict['jawOpen'];
                                else if (dict['viseme_aa'] !== undefined) mouthTargetIndex = dict['viseme_aa'];
                                else if (mouthTargetIndex === null && Object.keys(dict).length > 0) {
                                    mouthTargetIndex = 0;
                                }
                            }
                        }
                    });

                    scene.add(model);
                    loaderElem.style.display = 'none';
                    systemStatus.textContent = '3D 콩이 대기 중';
                    console.log("3D 모델 로드 완료");
                },
                function (xhr) {
                    if (xhr.lengthComputable) {
                        const percent = Math.round((xhr.loaded / xhr.total) * 100);
                        loaderElem.querySelector('span').textContent = `3D 콩이 로딩 중 (${percent}%)...`;
                    }
                },
                function (error) {
                    console.error("GLB 모델 로드 실패:", error);
                    loaderElem.innerHTML = `<span style="color:#f87171;">모델 로드 실패: ${error.message}</span>`;
                }
            );
        }

        // 3. Web Audio API 사운드 분석 엔진
        function ensureAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 64;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // 4. TTS (Web Speech API) & 음성 립싱크 시뮬레이터
        let ttsSynthOsc = null;
        let ttsSynthGain = null;

        function speakText(text) {
            ensureAudioContext();
            if (!text || !text.trim()) return;

            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0;
            utterance.pitch = 1.25; // 콩이의 귀여운 톤

            // 한국어 여성/자연스러운 음성 탐색
            const voices = window.speechSynthesis.getVoices();
            const koVoice = voices.find(v => v.lang.includes('ko') || v.name.includes('Korean') || v.name.includes('Yuna'));
            if (koVoice) utterance.voice = koVoice;

            // TTS 발화 시 Web Audio API Analyser로 가상 오디오 펄스를 공급하여 입/모션 실시간 연동
            utterance.onstart = () => {
                isSpeaking = true;
                systemStatus.textContent = '콩이가 말하는 중... 💬';
                speakBtn.innerHTML = '<span>🔊 발화 중...</span>';

                // 가상 오디오 신시사이저 생성해 분석기에 연결 (Web Audio 시각화 및 모션 트리거)
                try {
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, audioContext.currentTime);

                    // 발음 리듬감 에뮬레이션
                    gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                    osc.connect(gain);
                    gain.connect(analyser); // analyser에만 연결 (실제 소리는 TTS가 냄)

                    osc.start();
                    ttsSynthOsc = osc;
                    ttsSynthGain = gain;
                } catch(e) { console.log(e); }
            };

            utterance.onend = () => {
                isSpeaking = false;
                systemStatus.textContent = '3D 콩이 대기 중';
                speakBtn.innerHTML = '<span>🗣️ 말하기</span>';
                if (ttsSynthOsc) {
                    try {
                        ttsSynthOsc.stop();
                        ttsSynthOsc.disconnect();
                    } catch(e) {}
                    ttsSynthOsc = null;
                }
            };

            utterance.onerror = () => {
                isSpeaking = false;
                systemStatus.textContent = '3D 콩이 대기 중';
                speakBtn.innerHTML = '<span>🗣️ 말하기</span>';
            };

            window.speechSynthesis.speak(utterance);
        }

        // 5. 마이크 실시간 음성 인식 & 립싱크 모드
        async function toggleMic() {
            ensureAudioContext();
            if (isMicActive) {
                // 마이크 끄기
                if (micStream) {
                    micStream.getTracks().forEach(t => t.stop());
                }
                if (micSource) {
                    micSource.disconnect();
                }
                isMicActive = false;
                micBtn.classList.remove('active');
                micBtn.innerHTML = '<span>🎙️ 마이크 립싱크</span>';
                systemStatus.textContent = '3D 콩이 대기 중';
            } else {
                // 마이크 켜기
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    micSource = audioContext.createMediaStreamSource(micStream);
                    micSource.connect(analyser);
                    isMicActive = true;
                    micBtn.classList.add('active');
                    micBtn.innerHTML = '<span>🔴 마이크 켜짐</span>';
                    systemStatus.textContent = '마이크 음성에 실시간 반응 중 🎙️';
                } catch (err) {
                    alert('마이크 접근 권한이 필요합니다: ' + err.message);
                }
            }
        }

        // 6. 매 프레임 렌더 루프 및 오디오 반응형 3D 인터랙션
        let clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();
            let audioVolume = 0;

            // 오디오 데이터 분석
            if (analyser && dataArray) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i];
                }
                audioVolume = sum / dataArray.length; // 0 ~ 255

                // HUD 오디오 미터 시각화 업데이트
                for (let i = 0; i < meterBars.length; i++) {
                    const val = (dataArray[i * 2] || 0) / 255;
                    meterBars[i].style.transform = `scaleY(${Math.max(0.15, val * 1.5)})`;
                    meterBars[i].style.background = val > 0.4 ? '#38bdf8' : '#64748b';
                }
            }

            // 3D 캐릭터 실시간 모션 & 말하기 애니메이션
            if (model) {
                // 1) 기본 숨쉬기 / 유휴 흔들림 (Idle Breathing)
                const idleBob = Math.sin(elapsedTime * 2.2) * 0.015;
                const idleTilt = Math.sin(elapsedTime * 1.5) * 0.02;

                // 2) 말할 때 실시간 바운스 및 헤드 끄덕임 / 입 모양
                let talkBob = 0;
                let talkScaleY = 1.0;
                let talkScaleXZ = 1.0;
                let talkTilt = 0;

                const normalizedVol = Math.min(audioVolume / 45, 1.0);

                if (isSpeaking || isMicActive || normalizedVol > 0.08) {
                    talkBob = Math.sin(elapsedTime * 14) * 0.025 * normalizedVol;
                    talkScaleY = 1.0 + normalizedVol * 0.04;
                    talkScaleXZ = 1.0 - normalizedVol * 0.02;
                    talkTilt = Math.sin(elapsedTime * 8) * 0.04 * normalizedVol;
                }

                model.position.y = baseModelY + idleBob + talkBob;
                model.rotation.z = idleTilt + talkTilt;

                // 말할 때 몸통/턱의 미세한 스케일 펄스로 생동감 극대화
                model.scale.y = (1.4 / 1.0) * talkScaleY;
                model.scale.x = (1.4 / 1.0) * talkScaleXZ;
                model.scale.z = (1.4 / 1.0) * talkScaleXZ;

                // 모프 타겟이 있는 경우 실시간 입벌리기 적용
                if (mouthTargetIndex !== null) {
                    model.traverse((child) => {
                        if (child.isMesh && child.morphTargetInfluences) {
                            child.morphTargetInfluences[mouthTargetIndex] = normalizedVol > 0.1 ? normalizedVol : 0;
                        }
                    });
                }
            }

            if (controls) controls.update();
            renderer.render(scene, camera);
        }

        // 7. 창 크기 반응형 리사이즈
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 8. 이벤트 바인딩
        startBtn.addEventListener('click', () => {
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);
            ensureAudioContext();
            // 기본 환영 인사 발화
            const welcomeMsg = ttsInput.value || "안녕하세요, 여러분! 디지털 AI학교에 오신 것을 환영합니다.";
            speakText(welcomeMsg);
        });

        speakBtn.addEventListener('click', () => {
            const text = ttsInput.value;
            speakText(text);
        });

        ttsInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                speakText(ttsInput.value);
            }
        });

        resetCamBtn.addEventListener('click', () => {
            camera.position.set(initialCamPos.x, initialCamPos.y, initialCamPos.z);
            controls.target.set(0, 0.8, 0);
            controls.update();
        });

        micBtn.addEventListener('click', () => {
            toggleMic();
        });

        // 초기화 실행
        initThree();
        animate();
    </script>
</body>
</html>
