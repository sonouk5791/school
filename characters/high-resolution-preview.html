<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공식 캐릭터 고해상도 입모양</title>
<style>body{font-family:system-ui,sans-serif;background:#f6f5f1;color:#29394a;margin:24px}main{max-width:1250px;margin:auto}h1{font-size:28px}p{line-height:1.7}section{margin:30px 0}.frames{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}figure{margin:0;border:1px solid #d0d8d9;border-radius:16px;overflow:hidden;text-align:center;background:repeating-conic-gradient(#e2e9e9 0% 25%,#f8fbfb 0% 50%) 50%/20px 20px}img{width:100%;max-width:360px;height:auto;aspect-ratio:1;object-fit:contain;display:block;margin:auto}figcaption{padding:12px;background:#fff}button,a{font:inherit;padding:10px;cursor:pointer}.player{width:280px;max-width:80vw;margin:12px auto}.note{font-size:15px;color:#51616b}@media(max-width:700px){.frames{grid-template-columns:repeat(2,minmax(0,1fr))}body{margin:16px}}</style>
<main><h1>공식 캐릭터 고해상도 입모양</h1><p>1254 × 1254px 투명 PNG · 캐릭터마다 입 주변만 변경 · 아 / 에 / 이 / 오 / 우<br>체크무늬는 투명 배경 확인용이며 이미지에 포함되지 않습니다.</p><p class="note">내장 이미지 생성 도구로 새로 제작한 에셋입니다. 원본 시트를 자르거나 확대하지 않았습니다. 대기 표정은 우 입모양을 사용합니다.</p><a href="/">학교로 돌아가기</a> · <a href="/public/characters/characters-mouth-hd.zip" download>20개 PNG 한 번에 저장</a><div id="characters"></div></main>
<script src="/js/characters.js"></script><script>const vowels={a:'아',e:'에',i:'이',o:'오',u:'우'},timers=[];for(const [id,c] of Object.entries(characters)){const s=document.createElement('section');s.innerHTML=`<h2>${c.name}</h2><div class="frames">${Object.entries(c.mouth).map(([v,src])=>`<figure><img src="${src}" alt="${c.name} ${vowels[v]}" width="1254" height="1254"><figcaption>${vowels[v]} · <a href="${src}" download>PNG 저장</a></figcaption></figure>`).join('')}</div><div class="player"><img src="${c.idle}" width="1254" height="1254" alt="${c.name} 입모양 전환 검사"><button type="button">입모양 전환 확인</button></div>`;document.querySelector('#characters').append(s);const player=s.querySelector('.player img'),button=s.querySelector('button');let timer=null,index=0;button.onclick=()=>{if(timer){clearInterval(timer);timer=null;player.src=c.idle;button.textContent='입모양 전환 확인';}else{timer=setInterval(()=>{player.src=c.mouth['aeiou'[index++%5]]},420);timers.push(timer);button.textContent='멈추기';}};}addEventListener('pagehide',()=>timers.forEach(clearInterval));</script></html>
