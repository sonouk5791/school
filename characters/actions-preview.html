<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공식 캐릭터 동작 확인</title><style>body{font:17px/1.6 system-ui;background:#faf7ef;color:#443c32;margin:24px auto;padding:0 20px;max-width:1080px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}section{background:white;border:1px solid #d9d0bf;border-radius:20px;padding:20px}img{display:block;width:180px;height:202px;object-fit:contain;margin:auto}button{font:inherit;padding:8px;margin:3px;border:1px solid #bca984;border-radius:10px;background:#fffaf0;cursor:pointer}button:focus-visible{outline:3px solid #506845}h1{font-size:28px}small{display:block}a{color:#465f42}</style><h1>공식 캐릭터 동작 확인</h1><p>외형·의상으로 분류한 27개 동작입니다. 버튼을 누르면 같은 캐릭터의 해당 동작을 확인할 수 있습니다.</p><p>원본은 작은 이미지라 확대 시 흐릴 수 있습니다. 없는 동작은 임의 생성하지 않았습니다.</p><main></main><p><a href="reference/actions/classification-preview.png">36칸 분류표 보기</a> · <a href="reference/actions/classification.json">분류 근거 보기</a> · <a href="/">학교로 돌아가기</a></p><script src="../js/characters.js"></script><script src="../js/character-actions.js"></script><script>
for(const [id,c] of Object.entries(characters)){const section=document.createElement('section'),title=document.createElement('h2'),img=document.createElement('img'),status=document.createElement('small');title.textContent=c.name;img.src=c.idle;img.alt=c.name;status.setAttribute('role','status');section.append(title,img,status);for(const action of Object.keys(c.actions)){const b=document.createElement('button');b.textContent=action;b.onclick=()=>{CharacterActions.show(img,id,action);status.textContent=c.name+' · '+action;};section.append(b);}document.querySelector('main').append(section);}
</script></html>
