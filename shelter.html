<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보리의 쉼터 | 기억정원 라일락마을</title>
  <meta name="description" content="어르신이 편안하게 머무르고 긴장을 낮추는 따뜻한 정원 쉼터">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 보리의 쉼터 전용 특화 스타일 */
    .shelter-stage {
      display: grid;
      grid-template-columns: 1.15fr 0.95fr;
      gap: 32px;
      align-items: center;
      padding: 24px 8px;
    }

    .shelter-visual-card {
      background: #FFFFFF;
      border-radius: 36px;
      padding: 16px;
      box-shadow: 0 16px 40px rgba(139, 90, 43, 0.12);
      border: 4px solid #FFF;
      position: relative;
    }

    .shelter-image {
      width: 100%;
      height: 100%;
      border-radius: 26px;
      object-fit: cover;
      display: block;
    }

    .shelter-talk-card {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .shelter-bubble {
      background: linear-gradient(135deg, #FFFFFF 0%, #FFFDF9 100%);
      border-radius: 32px;
      padding: 32px;
      border: 3px solid #F3E5D8;
      border-left: 12px solid #E08244;
      box-shadow: 0 12px 30px rgba(100, 60, 20, 0.08);
      position: relative;
    }

    .shelter-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FFF3E0;
      color: #D84315;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 1.3rem;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .shelter-quotes {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .shelter-quotes .quote-1 {
      font-size: 2.1rem;
      font-weight: 900;
      color: #3E2723;
      line-height: 1.4;
    }

    .shelter-quotes .quote-2 {
      font-size: 1.65rem;
      font-weight: 700;
      color: #6D4C41;
      line-height: 1.4;
    }

    .shelter-quotes .quote-3 {
      font-size: 1.45rem;
      font-weight: 600;
      color: #795548;
    }

    .shelter-interactive-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .calm-action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 80px;
      padding: 16px 24px;
      border-radius: 28px;
      font-size: 1.55rem;
      font-weight: 800;
      cursor: pointer;
      border: none;
      transition: all 0.25s ease;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
    }

    .tea-btn {
      background: #FFF8E1;
      color: #8D6E63;
      border: 3px solid #FFE082;
    }
    .tea-btn:hover {
      background: #FFECB3;
      transform: translateY(-2px);
    }

    .breath-btn {
      background: #E8F5E9;
      color: #2E7D32;
      border: 3px solid #A5D6A7;
    }
    .breath-btn:hover {
      background: #C8E6C9;
      transform: translateY(-2px);
    }

    .next-activity-btn {
      background: linear-gradient(135deg, #7C4DFF 0%, #5E35B1 100%);
      color: #FFFFFF;
      min-height: 95px;
      font-size: 1.85rem;
      border-radius: 32px;
      box-shadow: 0 10px 24px rgba(124, 77, 255, 0.35);
      margin-top: 8px;
    }
    .next-activity-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 16px 32px rgba(124, 77, 255, 0.45);
    }

    /* 편안한 숨쉬기 가이드 원 */
    .breathe-modal {
      text-align: center;
    }
    .breathe-circle {
      width: 160px;
      height: 160px;
      margin: 24px auto;
      background: radial-gradient(circle, #A5D6A7 0%, #81C784 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1B5E20;
      font-size: 1.8rem;
      font-weight: 900;
      animation: breatheAnim 8s infinite ease-in-out;
      box-shadow: 0 10px 30px rgba(76, 175, 80, 0.3);
    }

    @keyframes breatheAnim {
      0%, 100% { transform: scale(0.9); content: "들이쉬고"; }
      50% { transform: scale(1.25); }
    }
  </style>
</head>
<body>
  <div id="app" class="village-container">
    
    <!-- 상단 헤더 -->
    <header class="top-header">
      <div class="brand-group">
        <a href="index.html" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
          <span class="sprout-badge">🌱</span>
          <h1 class="brand-title">기억정원 <span class="village-tag">라일락마을</span></h1>
        </a>
      </div>

      <div class="header-center-info">
        <span class="current-date">🍵 보리의 쉼터</span>
        <span class="weather-pill">🌿 마음이 편안해지는 시간</span>
      </div>

      <div class="quick-controls">
        <button id="shelterVoiceBtn" class="control-btn" title="보리 음성 듣기">
          <span class="ctrl-icon">🔊</span>
          <span class="ctrl-label">보리 목소리</span>
        </button>
        <button id="fontSizeBtn" class="control-btn" title="글씨 크기 키우기">
          <span class="ctrl-icon">🔍</span>
          <span class="ctrl-label">글씨 크게</span>
        </button>
      </div>
    </header>

    <!-- 메인 무대: 보리의 쉼터 -->
    <main class="shelter-stage">
      
      <!-- 좌측: 벤치에 앉은 보리와 따뜻한 정원 -->
      <section class="shelter-visual-card">
        <img src="./assets/bori_shelter.jpg" alt="벤치에 앉아 따뜻하게 맞이하는 보리" class="shelter-image">
        <div class="petal petal-1">🌸</div>
        <div class="petal petal-2">🌸</div>
      </section>

      <!-- 우측: 편안한 대화 및 다음 활동 버튼 -->
      <section class="shelter-talk-card">
        
        <div class="shelter-bubble">
          <div class="shelter-badge">
            <span>🐻</span>
            <span>보리와의 따뜻한 쉼터</span>
          </div>

          <div class="shelter-quotes">
            <p class="quote-1">“천천히 쉬어가도 괜찮아요.”</p>
            <p class="quote-2">“보리와 함께 편안한 시간을 보내요.”</p>
            <p class="quote-3">“어르신, 오늘도 함께라서 참 좋아요. 🌸”</p>
          </div>

          <button id="shelterListenBtn" class="bubble-listen-btn">
            <span>▶ 목소리 다시 듣기</span>
          </button>
        </div>

        <div class="shelter-interactive-box">
          <!-- 힐링 인터랙션 버튼들 -->
          <button id="drinkTeaBtn" class="calm-action-btn tea-btn">
            <span>🍵</span>
            <span>따뜻한 보리차 한 잔 마시기</span>
          </button>

          <button id="breatheGuideBtn" class="calm-action-btn breath-btn">
            <span>🌿</span>
            <span>보리와 천천히 숨고르기</span>
          </button>

          <!-- 핵심 요구사항: 다음 활동으로 가기 버튼 -->
          <a href="index.html" style="text-decoration: none;">
            <button class="calm-action-btn next-activity-btn">
              <span>다음 활동으로 가기 ➔</span>
            </button>
          </a>
        </div>

      </section>
    </main>

    <!-- 하단 바 -->
    <footer class="bottom-bar">
      <a href="index.html" style="text-decoration: none;">
        <button class="footer-btn home-btn">
          <span class="f-icon">🏡</span>
          <span class="f-text">처음 화면 (마을 마당)</span>
        </button>
      </a>

      <div class="center-cheer">
        <span class="cheer-dot"></span>
        <span class="cheer-text">마음이 편안해질 때까지 푹 쉬어가세요</span>
        <span class="cheer-dot"></span>
      </div>

      <div class="footer-right-group">
        <button class="footer-btn helper-btn" id="callHelperBtn">
          <span class="f-icon">🔔</span>
          <span class="f-text">선생님 부르기</span>
        </button>
      </div>
    </footer>

    <!-- 숨고르기 모달 -->
    <div id="breatheModal" class="modal-overlay hidden">
      <div class="modal-content breathe-modal">
        <h3>🌿 보리와 함께하는 천천히 숨쉬기</h3>
        <p style="font-size: 1.3rem; color: #555; margin-top: 8px;">초록 원이 커질 때 <strong>숨을 들이쉬고</strong>, 작아질 때 <strong>내쉬어보세요</strong>.</p>
        <div class="breathe-circle" id="breatheText">들이쉬고...</div>
        <button id="closeBreatheBtn" class="modal-btn confirm-btn" style="margin-top: 20px;">편안해졌어요 ↩</button>
      </div>
    </div>

  </div>

  <script>
    // 보리의 쉼터 인터랙션 스크립트
    document.addEventListener('DOMContentLoaded', () => {
      // 차임벨
      let audioCtx = null;
      function playSoftChime(freq = 440) {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.8);
        } catch (e) {}
      }

      const shelterScript = "천천히 쉬어가도 괜찮아요. 보리와 함께 편안한 시간을 보내요. 어르신, 오늘도 함께라서 참 좋아요.";

      function speakShelter(text = shelterScript) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = 'ko-KR';
        ut.rate = 0.85; // 아주 여유롭고 다정하게
        ut.pitch = 1.05;
        const voices = window.speechSynthesis.getVoices();
        const kv = voices.find(v => v.lang.includes('ko'));
        if (kv) ut.voice = kv;
        window.speechSynthesis.speak(ut);
      }

      document.getElementById('shelterVoiceBtn').addEventListener('click', () => {
        playSoftChime(523.25);
        speakShelter();
      });
      document.getElementById('shelterListenBtn').addEventListener('click', () => {
        playSoftChime(523.25);
        speakShelter();
      });

      // 차 마시기
      document.getElementById('drinkTeaBtn').addEventListener('click', () => {
        playSoftChime(587.33);
        speakShelter("따뜻하고 구수한 보리차예요. 어르신, 천천히 한 모금 드셔보세요. 몸과 마음이 사르르 따뜻해질 거예요.");
        alert("🍵 [따뜻한 보리차 한 잔]\n구수한 향기가 솔솔 피어납니다.\n어르신, 편안하게 목을 축이세요.");
      });

      // 숨쉬기 모달
      const bModal = document.getElementById('breatheModal');
      const bText = document.getElementById('breatheText');
      document.getElementById('breatheGuideBtn').addEventListener('click', () => {
        playSoftChime(523.25);
        bModal.classList.remove('hidden');
        speakShelter("보리를 따라 천천히 숨을 쉬어볼까요? 들이쉬고, 내쉬고...");
      });
      document.getElementById('closeBreatheBtn').addEventListener('click', () => {
        playSoftChime(440);
        bModal.classList.add('hidden');
      });

      // 글씨 확대
      document.getElementById('fontSizeBtn').addEventListener('click', () => {
        document.body.classList.toggle('font-large');
      });

      // 선생님 부르기
      document.getElementById('callHelperBtn').addEventListener('click', () => {
        alert("🔔 담당 선생님께 알림을 드렸습니다. 편안히 쉬고 계시면 곧 오실 거예요!");
      });
    });
  </script>
</body>
</html>
